<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive picture album featuring beautiful temples from around the world.">
    <meta name="author" content="Your Name">

    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../temples.css">
    <link rel="stylesheet" href="../temples-large.css">

</head>

<body>
    <header>
        <div class="header-content">
            <h1>Temple Album</h1>

            <button id="menu-button" aria-label="Open navigation menu" aria-expanded="false">
                ☰
            </button>

            <nav id="navigation">
                <a href="#" class="active">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Temple Gallery</h2>

        <div class="gallery">

            <figure>
                <img
                    src="../images/salt-lake-temple.jpg"
                    alt="Salt Lake Temple in Utah"
                    loading="lazy"
                >
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/johannesburg-south-africa-temple.jpg"
                    alt="Johannesburg South Africa Temple"
                    loading="lazy"
                >
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/nairobi-kenya-temple.jpg"
                    alt="Nairobi Kenya Temple"
                    loading="lazy"
                >
                <figcaption>Nairobi Kenya Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/harare-zimbabwe-temple.jpg"
                    alt="Harare Zimbabwe Temple"
                    loading="lazy"
                >
                <figcaption>Harare Zimbabwe Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/accra-ghana-temple.jpg"
                    alt="Accra Ghana Temple"
                    loading="lazy"
                >
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/london-england-temple.jpg"
                    alt="London England Temple"
                    loading="lazy"
                >
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/washington-dc-temple.jpg"
                    alt="Washington D.C. Temple"
                    loading="lazy"
                >
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/paris-france-temple.jpg"
                    alt="Paris France Temple"
                    loading="lazy"
                >
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure>
                <img
                    src="../images/rome-italy-temple.jpg"
                    alt="Rome Italy Temple"
                    loading="lazy"
                >
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="current-year"></span> Allan Dadirai Machingura | Zimbabwe
        </p>

        <p>
            Last Modified: <span id="last-modified"></span>
        </p>
    </footer>

    <script>
        const currentYear = document.querySelector("#current-year");
        const lastModified = document.querySelector("#last-modified");

        if (currentYear) {
            currentYear.textContent = new Date().getFullYear();
        }

        if (lastModified) {
            lastModified.textContent = new Date(document.lastModified).toLocaleDateString("en-GB");
        }

        const menuButton = document.querySelector("#menu-button");
        const navigation = document.querySelector("#navigation");

        if (menuButton && navigation) {
            menuButton.addEventListener("click", () => {
                const isOpen = navigation.classList.toggle("open");
                menuButton.setAttribute("aria-expanded", String(isOpen));
                menuButton.textContent = isOpen ? "✕" : "☰";
                menuButton.setAttribute(
                    "aria-label",
                    isOpen ? "Close navigation menu" : "Open navigation menu"
                );
            });
        }
    </script>
</body>
</html>
