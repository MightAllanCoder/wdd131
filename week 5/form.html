<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product Review Form for WDD 131 Assignment">
  <meta name="author" content="Allan Machingura">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="styles/scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review Form</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="productName">Product Name <span class="required">*</span></label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset class="rating">
        <legend>Overall Rating <span class="required">*</span></legend>
        <div class="stars">
          <input type="radio" id="star1" name="overallRating" value="1" required>
          <label for="star1">☆ 1</label>

          <input type="radio" id="star2" name="overallRating" value="2" required>
          <label for="star2">☆ 2</label>

          <input type="radio" id="star3" name="overallRating" value="3" required>
          <label for="star3">☆ 3</label>

          <input type="radio" id="star4" name="overallRating" value="4" required>
          <label for="star4">☆ 4</label>

          <input type="radio" id="star5" name="overallRating" value="5" required>
          <label for="star5">☆ 5</label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation <span class="required">*</span></label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features (Check all that apply)</legend>
        <label><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
        <label><input type="checkbox" id="easeOfUse" name="features" value="easeOfUse"> Ease of Use</label>
        <label><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
        <label><input type="checkbox" id="design" name="features" value="design"> Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review (Optional)</label>
      <textarea id="review" name="review" rows="5"></textarea>

      <!-- User Name -->
      <label for="username">Your Name (Optional)</label>
      <input type="text" id="username" name="username">

      <!-- Submit Button -->
      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Allan Machingura | WDD 131</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
